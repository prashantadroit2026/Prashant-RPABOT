<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<title>Sign in — Approval Bot</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page">
  <div class="brand">
    <h1>Approval Bot</h1>
    <p>Sign in to manage purchase requisitions</p>
  </div>

  <div class="auth-card">
    <h2>Sign in</h2>
    <div class="error" id="errorBox">Invalid email or password. Please try again.</div>
    <form id="loginForm" method="POST" action="/login">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@company.com" required autofocus />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Your password" required />
      </div>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
    <div class="demo-divider"><span>Try a demo account</span></div>
    <div class="demo-grid">
      <button class="demo-btn demo-admin" type="button" id="demo_admin">Admin</button>
      <button class="demo-btn demo-store" type="button" id="demo_store">Store</button>
      <button class="demo-btn demo-purchase" type="button" id="demo_purchase">Purchase</button>
      <button class="demo-btn demo-shopfloor" type="button" id="demo_shopfloor">Shopfloor</button>
    </div>
    <p class="hint">Demo buttons pre-fill a seeded account — just click one to sign in. Password is set by an administrator via the RBAC CLI or the admin page.</p>
  </div>

  <script src="js/gas-bridge.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (new URLSearchParams(window.location.search).has('error')) {
      document.getElementById('errorBox').style.display = 'block';
    }
    AB.api('/api/me').then(function (r) {
      var me = r.data || {};
      if (me && me.email) {
        window.location.href = AB.routeForRole(me);
      }
    });
  </script>
</body>
</html>
