services:
  backend:
    build: ./procurement-backend
    image: tcs-erp-procurement-hub:latest
    container_name: procurement-hub-backend
    ports:
      - "8080:8080"
    env_file:
      - ./procurement-backend/.env
    environment:
      - PORT=8080
      - DEBUG=false
      - SEED_ON_START=true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped