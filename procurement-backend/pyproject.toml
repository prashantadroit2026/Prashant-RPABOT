[project]
name = "procurement-hub-worker"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "gspread>=6.1",
    "google-auth>=2.34",
    "cryptography>=42",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[tool.setuptools]
packages = [
    "routers",
    "services",
    "sheets",
]