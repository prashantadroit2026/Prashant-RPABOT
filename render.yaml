# Render Blueprint – Procurement Hub (Google Sheets backend)
# Deploy: push this repo to GitHub, then in the Render dashboard pick
# "New → Blueprint" and select the repo. Render reads render.yaml automatically.
#
# The service account JSON is NOT committed (secrets/ is git-ignored). Set these
# env vars in the Render dashboard BEFORE the first deploy:
#   GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT  <- paste the full service-account JSON
#   GOOGLE_SHEET_ID                      <- the spreadsheet URL id
services:
  - type: web
    name: procurement-hub-backend
    rootDir: procurement-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT
        value: ""
      - key: GOOGLE_SHEET_ID
        value: ""
      - key: DEBUG
        value: "false"
      - key: SEED_ON_START
        value: "false"
      - key: CORS_ORIGINS
        value: '["*"]'